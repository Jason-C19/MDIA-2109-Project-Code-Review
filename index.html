<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0" />
        <title>Swapi - Furniture Marketplace</title>
        <link
            href="https://use.typekit.net/emy2djx.css"
            rel="stylesheet" />
        <link
            href="style.css"
            rel="stylesheet" />

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
        <script
            src="script.js"
            defer></script>
    </head>
    <body>
        <main>
            <section class="container">
                <div class="header-area">
                    <div class="search-wrapper">
                        <input
                            type="text"
                            id="searchInput"
                            class="search-input"
                            aria-label="Search for products" />
                        <span
                            class="search-placeholder"
                            aria-hidden="true"
                            >Search</span
                        >
                    </div>
                    <div
                        class="bell-wrapper"
                        role="button"
                        tabindex="0"
                        aria-label="Notifications">
                        <div
                            class="bell-icon"
                            aria-hidden="true">
                            🔔
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
