<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <head>
    <title>Project Code Review</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://use.typekit.net/emy2djx.css" rel="stylesheet" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="app">
      <header class="app__header">
        <h1 class="app__title">Product listing</h1>
      </header>

      <main class="app__main">
        <section class="search-panel">
          <div class="search-panel__row">
            <form class="search-panel__form">
              <input
                class="search-panel__input"
                type="text"
                placeholder="Search"
              />
            </form>
            <button class="search-panel__button" type="button">Alerts</button>
          </div>

          
<nav class="category-nav">
  <button class="category-nav__button category-nav__button--active" data-category="bedroom" type="button">Bedroom</button>
  <button class="category-nav__button" data-category="dining" type="button">Dining</button>
  <button class="category-nav__button" data-category="lighting" type="button">Lighting</button>
  <button class="category-nav__button" data-category="plants" type="button">Plants</button>
</nav>


<section class="products-section">
  <h2 class="products-section__title">Near me</h2>

  <div class="products-section__content products--bedroom"></div>
  <div class="products-section__content products--dining is-hidden"></div>
  <div class="products-section__content products--lighting is-hidden"></div>
  <div class="products-section__content products--plants is-hidden"></div>
</section>
      </main>

      <nav class="nav">
        <a class="nav__button nav__button--active" href="#">Home</a>
        <a class="nav__button" href="#">Explore</a>
        <a class="nav__button" href="#">Post</a>
        <a class="nav__button" href="#">Trades</a>
        <a class="nav__button" href="#">Profile</a>
      </nav>
    </div>
  </body>
</html>
